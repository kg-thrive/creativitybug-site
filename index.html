<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2e9">
  <meta name="description" content="CreativityBug.com — Inspiration is contagious. Catch the Creativity Bug. Domain inquiries and offers are welcome.">
  <title>CreativityBug.com — Catch the Creativity Bug</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root { color-scheme: light; --ink:#24342e; --muted:#617168; --paper:#f6f2e9; --green:#245541; --line:#d9dfd6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 50% 8%,#fff 0%,var(--paper) 70%); color:var(--ink); }
    main { min-height:100vh; max-width:820px; margin:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 22px 28px; text-align:center; }
    .bug { display:block; width:clamp(116px,24vw,178px); height:auto; margin:0 auto 8px; }
    h1 { margin:0; font-size:clamp(38px,8vw,70px); letter-spacing:-.055em; line-height:1.1; font-weight:750; overflow-wrap:anywhere; }
    .tagline { margin:20px 0 0; font-size:clamp(20px,3.5vw,27px); line-height:1.35; font-weight:700; }
    .tagline-small { margin:4px 0 0; font-size:clamp(17px,2.8vw,21px); color:var(--muted); }
    .divider { width:74px; height:1px; background:var(--line); margin:31px 0 24px; }
    .inquiry { margin:0; font-size:clamp(19px,3vw,23px); line-height:1.45; font-weight:650; }
    .offer { margin:8px 0 23px; font-size:16px; color:var(--muted); }
    .cta { display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:56px; border-radius:100px; padding:15px 34px; background:var(--green); color:#fff; font-size:17px; font-weight:700; text-decoration:none; box-shadow:0 5px 14px #24554120; transition:transform .15s,background .15s; }
    .cta:hover { transform:translateY(-2px); background:#193d2f; }
    .cta:focus-visible,.music a:focus-visible { outline:3px solid #b49b4e; outline-offset:5px; }
    .music { border-top:1px solid var(--line); padding-top:22px; margin-top:60px; width:100%; max-width:440px; }
    .music p { margin:0 0 8px; font-size:14px; color:var(--muted); }
    .music a { color:var(--green); font-size:15px; font-weight:650; text-underline-offset:4px; }
    footer { margin-top:auto; padding-top:50px; font-size:12px; color:#7e8b83; }
    @media (max-width:480px) { main { padding-top:32px; } .music { margin-top:47px; } }
    @media (prefers-reduced-motion:reduce) { .cta { transition:none; } }
  </style>
</head>
<body>
  <main>
    <img class="bug" src="/creativity-bug.png" alt="Smiling colorful Creativity Bug with B-shaped wings and a C-shaped body" width="460" height="460">
    <h1>CreativityBug.com</h1>
    <p class="tagline">Inspiration is contagious.</p>
    <p class="tagline-small">Catch the Creativity Bug.</p>
    <div class="divider" aria-hidden="true"></div>
    <p class="inquiry">Interested in acquiring this domain?</p>
    <p class="offer">Inquiries and offers are welcome.</p>
    <a class="cta" href="https://docs.google.com/forms/d/e/1FAIpQLScxF8e0E20awHrYVvCtOdU7j8G93cekCDX6kJfmgC-Kqp-O0Q/viewform" target="_blank" rel="noopener noreferrer">Get in touch <span aria-hidden="true">↗</span></a>
    <section class="music" aria-label="Explore music">
      <p>While you're here, there's some music to explore.</p>
      <a href="https://music.creativitybug.com/">Visit the music site ↗</a>
    </section>
    <footer>© <span id="year">2026</span> Creativity Bug</footer>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
